<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAJ Client Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
/* ============ TOKENS ============ */
:root{
  --brand:#17b8a6; --brand-ink:#0c4f48; --brand-soft:rgba(23,184,166,.14);
  --appt:#f6b93b; --appt-soft:rgba(246,185,59,.15);
  --brandline:#c879f0; --brandline-soft:rgba(200,121,240,.15);
  --good:#3dd68c; --warn:#f2a33c; --crit:#f5576c;
  --good-soft:rgba(61,214,140,.14); --warn-soft:rgba(242,163,60,.15); --crit-soft:rgba(245,87,108,.14);

  --bg:#f4f6f6; --panel:#ffffff; --elev:#ffffff; --sunken:#eef1f1;
  --line:#dde3e3; --line-soft:#e8ecec;
  --ink:#111b1d; --text:#243033; --muted:#5d6d71; --faint:#8a999d;
  --shadow:0 1px 2px rgba(16,32,34,.04),0 8px 24px -12px rgba(16,32,34,.18);
  --shadow-lg:0 24px 60px -24px rgba(16,32,34,.36);
  --radius:14px; --radius-sm:9px;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d1416; --panel:#141d20; --elev:#182226; --sunken:#101819;
  --line:#26343a; --line-soft:#1e2a2e;
  --ink:#eef5f4; --text:#dbe6e6; --muted:#93a6ab; --faint:#68797e;
  --brand-soft:rgba(23,184,166,.18); --appt-soft:rgba(246,185,59,.16); --brandline-soft:rgba(200,121,240,.18);
  --good-soft:rgba(61,214,140,.16); --warn-soft:rgba(242,163,60,.16); --crit-soft:rgba(245,87,108,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 30px 70px -28px rgba(0,0,0,.72);
}}
:root[data-theme="dark"]{
  --bg:#0d1416; --panel:#141d20; --elev:#182226; --sunken:#101819;
  --line:#26343a; --line-soft:#1e2a2e;
  --ink:#eef5f4; --text:#dbe6e6; --muted:#93a6ab; --faint:#68797e;
  --brand-soft:rgba(23,184,166,.18); --appt-soft:rgba(246,185,59,.16); --brandline-soft:rgba(200,121,240,.18);
  --good-soft:rgba(61,214,140,.16); --warn-soft:rgba(242,163,60,.16); --crit-soft:rgba(245,87,108,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 30px 70px -28px rgba(0,0,0,.72);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01";
}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif;color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--brand-soft)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:20px 14px;position:sticky;top:0;height:100vh;
}
.brandmark{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#0f8f81);display:grid;place-items:center;color:#04211d;font-family:"Archivo";font-weight:800;font-size:17px;flex:none}
.brandmark b{font-family:"Archivo";font-weight:800;color:var(--ink);font-size:15px;letter-spacing:-.02em;line-height:1.05}
.brandmark span{display:block;font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600;padding:14px 10px 6px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;width:100%;text-align:left;transition:background .12s,color .12s}
.navitem svg{width:18px;height:18px;flex:none}
.navitem:hover{background:var(--sunken);color:var(--text)}
.navitem.on{background:var(--brand-soft);color:var(--brand-ink)}
:root[data-theme="dark"] .navitem.on,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .navitem.on{color:var(--brand)}}
.navitem .badge{margin-left:auto;font-size:11px;background:var(--sunken);color:var(--muted);padding:1px 7px;border-radius:20px;font-weight:600}
.navitem.on .badge{background:rgba(255,255,255,.5);color:var(--brand-ink)}
.railfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
.savechip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);padding:4px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.saving{background:var(--warn);animation:pulse 1s infinite}
.dot.err{background:var(--crit)}
@keyframes pulse{50%{opacity:.35}}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);padding:15px 30px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:20px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
.spacer{flex:1}
.content{padding:26px 30px 70px;max-width:var(--maxw);width:100%;margin:0 auto}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--elev);color:var(--text);padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;transition:transform .08s,border-color .12s,background .12s}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#042320}
.btn.primary:hover{background:#14a897}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunken);color:var(--text);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--elev);color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--brand)}
.iconbtn svg{width:17px;height:17px}

/* ============ CARDS / GRID ============ */
.tilerow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.tile .v{font-family:"Archivo";font-weight:800;font-size:30px;color:var(--ink);margin-top:9px;line-height:1;letter-spacing:-.02em}
.tile .v small{font-size:14px;color:var(--faint);font-weight:600;letter-spacing:0}
.tile .meta{font-size:12px;color:var(--faint);margin-top:7px}
.tile .rail-accent{position:absolute;left:0;top:0;bottom:0;width:3px}

.sectionhead{display:flex;align-items:center;gap:12px;margin:8px 0 15px}
.sectionhead h2{font-size:17px}
.sectionhead .line{flex:1;height:1px;background:var(--line-soft)}
.sectionhead .count{font-size:12.5px;color:var(--faint);font-weight:600}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,border-color .12s,box-shadow .12s;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.ccard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--brand) 50%,var(--line));box-shadow:var(--shadow-lg)}
.ccard .top{padding:16px 17px 13px;display:flex;gap:13px;align-items:flex-start}
.avatar{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-family:"Archivo";font-weight:800;font-size:17px;flex:none;color:#fff}
.ccard h3{font-size:16px;line-height:1.15}
.ccard .who{font-size:12.5px;color:var(--muted);margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip .cd{width:6px;height:6px;border-radius:50%}
.chip.appt{background:var(--appt-soft);color:#8a6410}
.chip.brandline{background:var(--brandline-soft);color:#7a3ba3}
:root[data-theme="dark"] .chip.appt,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.appt{color:var(--appt)}}
:root[data-theme="dark"] .chip.brandline,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.brandline{color:var(--brandline)}}
.chip.st{background:var(--sunken);color:var(--muted)}
.chip.good{background:var(--good-soft);color:#1c854f}
.chip.warn{background:var(--warn-soft);color:#8a5a12}
.chip.crit{background:var(--crit-soft);color:#a92740}
:root[data-theme="dark"] .chip.good,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.good{color:var(--good)}}
:root[data-theme="dark"] .chip.warn,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.warn{color:var(--warn)}}
:root[data-theme="dark"] .chip.crit,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.crit{color:var(--crit)}}
.ccard .strip{display:flex;gap:0;border-top:1px solid var(--line-soft);margin-top:2px}
.ccard .kpi{flex:1;padding:11px 12px;border-right:1px solid var(--line-soft)}
.ccard .kpi:last-child{border-right:0}
.ccard .kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.ccard .kpi .num{font-family:"IBM Plex Mono";font-weight:600;font-size:17px;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.ccard .foot{padding:10px 17px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:9px;font-size:12px;color:var(--faint)}

/* empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:54px 30px;text-align:center;background:var(--panel)}
.empty .ic{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center;margin:0 auto 16px;color:var(--brand)}
.empty h3{font-size:19px;margin-bottom:7px}
.empty p{color:var(--muted);max-width:420px;margin:0 auto 20px}
.empty .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ============ CLIENT DETAIL ============ */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
.crumb button{border:0;background:none;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:0}
.crumb button:hover{color:var(--brand)}
.chead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.chead .idbox{display:flex;gap:15px;align-items:center;flex:1;min-width:260px}
.chead .avatar{width:58px;height:58px;font-size:23px;border-radius:14px}
.chead h1{font-size:26px}
.chead .tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chead .actions{display:flex;gap:9px;flex-wrap:wrap}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 15px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
:root[data-theme="dark"] .tab.on,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on{color:var(--brand)}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel .ph{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.panel .ph h3{font-size:15px}
.panel .ph .line{flex:1}
.panel .pb{padding:18px}

.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.field .val{font-size:14.5px;color:var(--text)}
.field .val.empty-v{color:var(--faint);font-style:italic}
input,select,textarea{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font-family:inherit;font-size:14px;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;background:var(--panel)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.editrow{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* metric entry */
.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.minput label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:5px;display:block}
.minput input{text-align:left;font-family:"IBM Plex Mono";font-weight:500}

table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{text-align:right;padding:9px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
table.log th:first-child,table.log td:first-child{text-align:left}
table.log td{padding:9px 11px;border-bottom:1px solid var(--line-soft);font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;text-align:right;color:var(--text)}
table.log td:first-child{font-family:"Instrument Sans";color:var(--muted);font-weight:600}
table.log tr:hover td{background:var(--sunken)}
.tablewrap{overflow-x:auto}

/* tasks */
.tasklist{display:flex;flex-direction:column;gap:2px}
.taskrow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;border:1px solid transparent;transition:background .1s}
.taskrow:hover{background:var(--sunken)}
.taskrow.done{opacity:.55}
.taskrow.done .tt{text-decoration:line-through}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;cursor:pointer;transition:.12s;background:var(--panel)}
.check:hover{border-color:var(--brand)}
.check.on{background:var(--brand);border-color:var(--brand)}
.check svg{width:12px;height:12px;color:#042320;opacity:0;transition:opacity .1s}
.check.on svg{opacity:1}
.taskrow .tt{flex:1;font-size:14px;font-weight:500}
.taskrow .tmeta{font-size:11.5px;color:var(--faint);display:flex;gap:8px;align-items:center}
.pri{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px}
.pri.high{background:var(--crit-soft);color:var(--crit)}
.pri.med{background:var(--warn-soft);color:var(--warn)}
.pri.low{background:var(--sunken);color:var(--faint)}
.duetag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.duetag.over{background:var(--crit-soft);color:var(--crit)}
.duetag.today{background:var(--brand-soft);color:var(--brand-ink)}
:root[data-theme="dark"] .duetag.today,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .duetag.today{color:var(--brand)}}
.addtask{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.addtask input{flex:1;min-width:170px}
.addtask select{width:auto;min-width:110px}

/* checklist */
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cl-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line-soft);border-radius:10px;font-size:14px;font-weight:500;background:var(--panel)}
.cl-item.on{background:var(--good-soft);border-color:transparent}

/* pipeline / funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fstage{display:flex;align-items:center;gap:13px}
.fstage .fbar{height:34px;border-radius:8px;background:var(--brand);display:flex;align-items:center;padding:0 12px;color:#042320;font-weight:700;font-family:"IBM Plex Mono";min-width:44px;transition:width .4s}
.fstage .flab{font-size:13px;font-weight:600;width:130px;flex:none;color:var(--text)}
.fstage .fpct{font-size:12px;color:var(--faint);font-family:"IBM Plex Mono"}

/* progress bar */
.pbar{height:8px;border-radius:20px;background:var(--sunken);overflow:hidden;margin-top:8px}
.pbar span{display:block;height:100%;border-radius:20px;background:var(--brand);transition:width .4s}
.goalrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.goalrow b{font-family:"IBM Plex Mono";color:var(--ink);font-weight:600}

/* sparkline card */
.trendcard{padding:15px 17px}
.trendcard .th{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.trendcard .tk{font-size:12.5px;color:var(--muted);font-weight:600}
.trendcard .tv{font-family:"Archivo";font-weight:800;font-size:24px;color:var(--ink);letter-spacing:-.02em}
.delta{font-size:12px;font-weight:700;font-family:"IBM Plex Mono"}
.delta.up{color:var(--good)}.delta.down{color:var(--crit)}.delta.flat{color:var(--faint)}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba:8,15,16,.55;background:color-mix(in srgb,#060d0e 55%,transparent);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .16s}
.overlay.on{opacity:1;pointer-events:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;transform:translateY(10px) scale(.99);transition:transform .18s}
.overlay.on .modal{transform:none}
.modal .mh{padding:20px 22px 0;display:flex;align-items:flex-start;gap:12px}
.modal .mh h2{font-size:19px}
.modal .mh p{font-size:13px;color:var(--muted);margin:3px 0 0}
.modal .mb{padding:18px 22px}
.modal .mf{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--panel)}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:4px}
.typeopt{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.12s;background:var(--panel)}
.typeopt:hover{border-color:var(--muted)}
.typeopt.sel{border-color:var(--brand);background:var(--brand-soft)}
.typeopt .ti{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;margin-bottom:9px}
.typeopt h4{font-size:14.5px;margin-bottom:3px}
.typeopt p{font-size:12px;color:var(--muted);line-height:1.4}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:.2s;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px}
.toast.on{opacity:1;transform:translateX(-50%)}

.banner{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--text);padding:11px 16px;border-radius:11px;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.banner svg{width:18px;height:18px;color:var(--warn);flex:none}

.hint{font-size:12px;color:var(--faint);margin-top:6px}
.muted{color:var(--muted)}
.rowsplit{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tagline{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:3px 9px;border-radius:7px;background:var(--sunken);color:var(--muted);font-weight:600}
.emptymini{padding:26px;text-align:center;color:var(--faint);font-size:13.5px}

/* mobile */
.menubtn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;z-index:60;width:236px;transform:translateX(-110%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .rail.open{transform:none}
  .menubtn{display:grid}
  .grid2,.grid3,.checklist,.editrow{grid-template-columns:1fr}
  .content{padding:20px 18px 60px}
  .topbar{padding:13px 18px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
  .scrim.on{display:block}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brandmark">
      <div class="logo">K</div>
      <div><b>KAJ Command</b><span>Client Progress OS</span></div>
    </div>
    <div class="navlabel">Workspace</div>
    <button class="navitem on" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      Dashboard</button>
    <button class="navitem" data-nav="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Today <span class="badge" id="todayBadge">0</span></button>
    <button class="navitem" data-nav="clients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      All Clients <span class="badge" id="clientsBadge">0</span></button>
    <div class="navlabel">Filter by track</div>
    <button class="navitem" data-nav="appt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Appointment Setting</button>
    <button class="navitem" data-nav="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21 8 14 2 9.4h7.6z"/></svg>
      Personal Branding</button>
    <div class="railfoot">
      <button class="navitem" data-nav="guide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
        SOP &amp; Metrics Guide</button>
      <button class="navitem" id="themeToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        Toggle theme</button>
      <div class="savechip"><span class="dot" id="saveDot"></span><span id="saveText">All changes saved</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="iconbtn menubtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Every client, every KPI, one place.</div>
      </div>
      <div class="spacer"></div>
      <button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Add client</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   KAJ CLIENT COMMAND — client progress tracker
   Persistence: classic artifact, files-form publish of data/state.json
   ========================================================================= */
(function(){
"use strict";

/* ---------- KPI SCHEMAS (from KAJ SOPs) ---------- */
const APPT_METRICS = [
  {k:"outreach", label:"Outreach sent", hint:"DMs, emails, connection reqs"},
  {k:"dials", label:"Dials / calls", hint:"Cold calls attempted"},
  {k:"convos", label:"Conversations", hint:"Live connects / replies"},
  {k:"positive", label:"Positive replies", hint:"Interested responses"},
  {k:"booked", label:"Calls booked", hint:"Strategy calls set"},
  {k:"showed", label:"Calls showed", hint:"Prospect attended"},
  {k:"qualified", label:"Qualified", hint:"Fit + budget confirmed"},
  {k:"closed", label:"Closed / won", hint:"Deals signed"},
  {k:"followups", label:"Follow-ups", hint:"Touchpoints sent"}
];
const BRAND_METRICS = [
  {k:"produced", label:"Content produced", hint:"Reels, carousels, emails made"},
  {k:"posted", label:"Content posted", hint:"Assets published"},
  {k:"impressions", label:"Impressions", hint:"Total reach"},
  {k:"visits", label:"Profile visits", hint:"Content → curiosity"},
  {k:"saves", label:"Saves", hint:"Resonance signal"},
  {k:"dms", label:"DMs received", hint:"CTA / interest"},
  {k:"clicks", label:"Link clicks", hint:"Bio / email clicks"},
  {k:"booked", label:"Calls booked", hint:"From content funnel"},
  {k:"revenue", label:"Revenue (₹)", hint:"Attributed this day"}
];
const DELIVERY = [
  {k:"audit", label:"Audit completed"},
  {k:"content", label:"Content delivered"},
  {k:"revisions", label:"Revisions done"},
  {k:"finalpack", label:"Final delivery pack sent"},
  {k:"loom", label:"Loom walkthrough done"},
  {k:"testimonial", label:"Testimonial collected"},
  {k:"upsell", label:"Upsell offered"}
];
const OFFER_TIERS = ["Audit","Starter","Magnet","Takeover"];
const OWNERS = ["Kanieshk","Copy VA","Creative VA","Metrics VA","Setter","Closer"];
const AS_CHANNELS = ["Cold Call","WhatsApp","Email","Voice Note","DM"];
const PLATFORMS = ["Instagram","YouTube","Twitter/X","LinkedIn","Email","WhatsApp"];
const STATUSES = ["Onboarding","Active","At Risk","Paused","Delivered"];

/* Funnel definitions for card mini-strips & pipeline view */
const APPT_FUNNEL = [["outreach","Outreach"],["convos","Convos"],["positive","Positive"],["booked","Booked"],["showed","Showed"],["closed","Closed"]];

/* ---------- STATE ---------- */
let state = {clients:[], meta:{}};
let cap = null;           // artifact capability
let readOnly = false;
let ui = {view:"home", filter:"all", clientId:null, tab:"overview", railOpen:false};
let saveTimer = null, saveState = "idle";

const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr = ()=>new Date().toISOString().slice(0,10);
const fmt = n=>{n=Number(n)||0; return n>=1000? (n>=100000? (n/100000).toFixed(n%100000?1:0)+"L" : n.toLocaleString("en-IN")) : String(n);};
const num = v=>{const n=parseFloat(v); return isNaN(n)?0:n;};
const pct = (a,b)=> b>0? Math.round(a/b*100) : 0;

/* ---------- PERSISTENCE ---------- */
async function boot(){
  try{
    const r = await fetch("data/state.json",{cache:"no-store"});
    if(r.ok){ const d = await r.json(); if(d && Array.isArray(d.clients)) state = d; }
  }catch(e){/* first run: no file yet */}
  try{ cap = await (window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null)); }
  catch(e){ cap = null; }
  if(!cap) readOnly = true;
  const saved = sessionStorage.getItem("kaj_ui");
  if(saved){ try{ ui = Object.assign(ui, JSON.parse(saved)); }catch(e){} }
  const th = localStorage.getItem("kaj_theme"); if(th) document.documentElement.setAttribute("data-theme",th);
  render();
}
function persistUI(){ sessionStorage.setItem("kaj_ui", JSON.stringify({view:ui.view,filter:ui.filter,clientId:ui.clientId,tab:ui.tab})); }

function scheduleSave(){
  if(readOnly){ setSave("readonly"); return; }
  state.meta.updatedAt = new Date().toISOString();
  setSave("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 900);
}
async function doSave(){
  if(!cap){ setSave("readonly"); return; }
  try{
    await cap.publish({"data/state.json": {content: JSON.stringify(state), contentType:"application/json"}});
    setSave("saved");
  }catch(err){
    const code = err && err.code;
    if(code==="conflict"){ setSave("conflict"); return; } // shell reloads to winner
    if(code==="not_writer"||code==="not_granted"||code==="capability_disabled"||code==="not_declared"){
      readOnly=true; setSave("readonly");
    }else if(code==="rate_limited"){
      clearTimeout(saveTimer); saveTimer=setTimeout(doSave,3000); setSave("saving");
    }else{ // try full-page fallback once, else report
      setSave("error");
    }
  }
}
function setSave(s){
  saveState=s;
  const dot=$("#saveDot"), txt=$("#saveText");
  if(!dot)return;
  dot.className="dot";
  const map={
    idle:["All changes saved",""], saved:["All changes saved",""],
    saving:["Saving…","saving"], readonly:["Read-only view","err"],
    error:["Save failed — retrying","err"], conflict:["Synced by teammate","saving"]
  };
  const m=map[s]||map.idle; txt.textContent=m[0]; if(m[1])dot.classList.add(m[1]);
}

/* ---------- HELPERS ---------- */
function getClient(id){ return state.clients.find(c=>c.id===id); }
function avatarColor(name){
  const colors=["#17b8a6","#f6b93b","#c879f0","#3b9bff","#f5576c","#3dd68c","#ff8a3c","#9b8cff"];
  let h=0; for(const ch of (name||"?")) h=(h*31+ch.charCodeAt(0))%colors.length; return colors[h];
}
function initials(n){ return (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function sumMetric(c,k,days){
  const logs = (c.logs||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const slice = days? logs.slice(0,days):logs;
  return slice.reduce((s,l)=>s+num(l[k]),0);
}
function last7(c,k){
  const map={}; (c.logs||[]).forEach(l=>{map[l.date]=(map[l.date]||0)+num(l[k]);});
  const arr=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);arr.push(map[ds]||0);} return arr;
}
function tasksDueToday(c){ return (c.tasks||[]).filter(t=>!t.done && t.due && t.due<=todayStr()); }
function allOpenTasks(){
  const out=[]; state.clients.forEach(c=>(c.tasks||[]).forEach(t=>{ if(!t.done) out.push({c,t}); })); return out;
}

/* ---------- SPARKLINE ---------- */
function spark(vals,w,h,color){
  w=w||120;h=h||34;color=color||"var(--brand)";
  const max=Math.max(...vals,1), min=Math.min(...vals,0);
  const rng=max-min||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w, h-4-((v-min)/rng)*(h-8)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${w} ${h} L 0 ${h} Z`;
  const id="g"+uid();
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.6" fill="${color}"/>
  </svg>`;
}

/* =========================================================================
   RENDER ROUTER
   ========================================================================= */
function render(){
  document.querySelectorAll(".navitem[data-nav]").forEach(b=>b.classList.toggle("on",b.dataset.nav===ui.view || (ui.view==="client"&&b.dataset.nav==="clients")));
  $("#clientsBadge").textContent = state.clients.length;
  const td = state.clients.reduce((s,c)=>s+tasksDueToday(c).length,0);
  $("#todayBadge").textContent = td;
  const v=$("#view"); v.innerHTML="";
  if(ui.view==="client" && getClient(ui.clientId)) renderClient(v,getClient(ui.clientId));
  else if(ui.view==="today") renderToday(v);
  else if(ui.view==="guide") renderGuide(v);
  else renderHome(v);
  persistUI();
  if(readOnly && saveState!=="readonly") setSave("readonly");
}

/* ---------- HOME / LISTS ---------- */
function setHead(t,s){ $("#pageTitle").textContent=t; $("#pageSub").textContent=s; }
function renderHome(v){
  let title="Dashboard", sub="Every client, every KPI, one place.", list=state.clients;
  if(ui.view==="clients"){title="All Clients";sub="Open any client to track progress.";}
  if(ui.filter==="appt"){title="Appointment Setting";sub="Outbound booking pipelines.";list=state.clients.filter(c=>c.type==="appt");}
  if(ui.filter==="brand"){title="Personal Branding";sub="Content & creative growth engines.";list=state.clients.filter(c=>c.type==="brand");}
  setHead(title,sub);

  if(readOnly) v.appendChild(el("div","banner",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg> <span><b>Read-only view.</b> You can explore everything, but changes won\'t be saved. Open the artifact from your own account to edit.</span>'));

  if(ui.view!=="clients" && ui.filter==="all"){
    v.appendChild(buildSummary());
  }

  const head=el("div","sectionhead");
  head.innerHTML=`<h2>${ui.filter==="all"?"Clients":title}</h2><span class="count">${list.length} total</span><div class="line"></div>`;
  const addMini=el("button","btn sm",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Add');
  addMini.onclick=openAddModal; if(!readOnly) head.appendChild(addMini);
  v.appendChild(head);

  if(!list.length){ v.appendChild(buildEmpty()); return; }
  const grid=el("div","cardgrid");
  list.forEach(c=>grid.appendChild(buildCard(c)));
  v.appendChild(grid);
}

function buildSummary(){
  const wrap=el("div","tilerow");
  const appt=state.clients.filter(c=>c.type==="appt"), brand=state.clients.filter(c=>c.type==="brand");
  const booked7=state.clients.reduce((s,c)=>s+sumMetric(c,"booked",7),0);
  const closed7=appt.reduce((s,c)=>s+sumMetric(c,"closed",7),0);
  const rev30=brand.reduce((s,c)=>s+sumMetric(c,"revenue",30),0);
  const openTasks=allOpenTasks().length;
  const atRisk=state.clients.filter(c=>c.status==="At Risk").length;
  const tiles=[
    {k:"Active clients",v:state.clients.filter(c=>c.status!=="Paused"&&c.status!=="Delivered").length,meta:`${appt.length} setting · ${brand.length} branding`,c:"var(--brand)"},
    {k:"Calls booked · 7d",v:booked7,meta:"across all pipelines",c:"var(--appt)"},
    {k:"Deals closed · 7d",v:closed7,meta:"appointment setting",c:"var(--good)"},
    {k:"Revenue · 30d",v:"₹"+fmt(rev30),meta:"branding attributed",c:"var(--brandline)"},
    {k:"Open tasks",v:openTasks,meta:atRisk?atRisk+" client(s) at risk":"team workload",c:atRisk?"var(--crit)":"var(--muted)"}
  ];
  tiles.forEach(t=>{
    const d=el("div","tile");
    d.innerHTML=`<div class="rail-accent" style="background:${t.c}"></div><div class="k">${t.k}</div><div class="v">${t.v}</div><div class="meta">${t.meta}</div>`;
    wrap.appendChild(d);
  });
  return wrap;
}

function buildCard(c){
  const b=el("button","ccard");
  const isAppt=c.type==="appt";
  const chipCls=isAppt?"appt":"brandline";
  const chipTxt=isAppt?"Appointment Setting":"Personal Branding";
  const stCls = c.status==="At Risk"?"crit":c.status==="Active"?"good":c.status==="Paused"?"st":"warn";
  let kpis;
  if(isAppt){
    kpis=[["Booked 7d",sumMetric(c,"booked",7)],["Showed 7d",sumMetric(c,"showed",7)],["Closed 7d",sumMetric(c,"closed",7)]];
  }else{
    kpis=[["Reach 7d",fmt(sumMetric(c,"impressions",7))],["DMs 7d",sumMetric(c,"dms",7)],["Rev 30d","₹"+fmt(sumMetric(c,"revenue",30))]];
  }
  const due=tasksDueToday(c).length;
  b.innerHTML=`
    <div class="top">
      <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}</div>
      <div style="flex:1;min-width:0">
        <h3>${esc(c.name)}</h3>
        <div class="who">${esc(c.owner||"Unassigned")}${c.niche?" · "+esc(c.niche):""}</div>
      </div>
      <span class="chip ${chipCls}"><span class="cd" style="background:${isAppt?'var(--appt)':'var(--brandline)'}"></span>${isAppt?"Setting":"Branding"}</span>
    </div>
    <div class="strip">
      ${kpis.map(k=>`<div class="kpi"><div class="lab">${k[0]}</div><div class="num">${k[1]}</div></div>`).join("")}
    </div>
    <div class="foot">
      <span class="chip ${stCls}">${esc(c.status||"Active")}</span>
      ${due?`<span class="duetag today">${due} due today</span>`:`<span>${(c.tasks||[]).filter(t=>!t.done).length} open tasks</span>`}
      <span style="margin-left:auto;color:var(--faint)">Open →</span>
    </div>`;
  b.onclick=()=>{ui.view="client";ui.clientId=c.id;ui.tab="overview";render();};
  return b;
}

function buildEmpty(){
  const e=el("div","empty");
  e.innerHTML=`<div class="ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg></div>
    <h3>No clients yet</h3>
    <p>Add your first client to spin up their progress dashboard — pick Appointment Setting or Personal Branding and the right KPIs load automatically.</p>
    <div class="btns"></div>`;
  const a=el("button","btn primary",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Add first client');
  a.onclick=openAddModal;
  const s=el("button","btn ghost","Load 2 sample clients");
  s.onclick=loadSamples;
  e.querySelector(".btns").append(a); if(!readOnly) e.querySelector(".btns").append(s);
  return e;
}

/* ---------- CLIENT DETAIL ---------- */
function renderClient(v,c){
  setHead(c.name, c.type==="appt"?"Appointment setting pipeline":"Personal branding engine");
  const isAppt=c.type==="appt";
  const crumb=el("div","crumb");
  crumb.innerHTML=`<button id="back"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Clients</button> <span>/</span> <span style="color:var(--text);font-weight:600">${esc(c.name)}</span>`;
  crumb.querySelector("#back").onclick=()=>{ui.view=ui.filter==="appt"||ui.filter==="brand"?"clients":"home";render();};
  v.appendChild(crumb);

  const head=el("div","chead");
  head.innerHTML=`
    <div class="idbox">
      <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}</div>
      <div>
        <h1>${esc(c.name)}</h1>
        <div class="tags">
          <span class="chip ${isAppt?'appt':'brandline'}"><span class="cd" style="background:${isAppt?'var(--appt)':'var(--brandline)'}"></span>${isAppt?"Appointment Setting":"Personal Branding"}</span>
          <span class="chip ${c.status==='At Risk'?'crit':c.status==='Active'?'good':'st'}">${esc(c.status||"Active")}</span>
          ${c.offerTier?`<span class="pill">${esc(c.offerTier)}</span>`:""}
          <span class="pill">${esc(c.owner||"Unassigned")}</span>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="editBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Edit details</button>
      <button class="btn danger" id="delBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>`;
  if(!readOnly){ head.querySelector("#editBtn").onclick=()=>openEditModal(c); head.querySelector("#delBtn").onclick=()=>confirmDelete(c); }
  else head.querySelector(".actions").style.display="none";
  v.appendChild(head);

  const tabsWrap=el("div","tabs");
  const tabs=[["overview","Overview"],["kpi","Log KPIs"],["trends","Trends"],["tasks","Tasks"],[isAppt?"pipeline":"delivery",isAppt?"Pipeline":"Delivery"]];
  tabs.forEach(([k,lab])=>{
    const t=el("button","tab"+(ui.tab===k?" on":""),lab);
    t.onclick=()=>{ui.tab=k;render();};
    tabsWrap.appendChild(t);
  });
  v.appendChild(tabsWrap);

  const body=el("div");
  if(ui.tab==="overview") renderOverview(body,c);
  else if(ui.tab==="kpi") renderKpiTab(body,c);
  else if(ui.tab==="trends") renderTrends(body,c);

  v.appendChild(body);
}

    row.appendChild(t);

function renderKpiTab(v,c){
  const isAppt=c.type==="appt";
  const metrics=isAppt?APPT_METRICS:BRAND_METRICS;
  const p=el("div","panel");
  const today=todayStr();
  const existing=(c.logs||[]).find(l=>l.date===today)||{};
  p.innerHTML=`<div class="ph"><h3>Log daily KPIs</h3><div class="line"></div></div><div class="pb">
    <div class="field" style="max-width:220px"><label>Entry date</label><input type="date" id="logDate" value="${today}" max="${today}"></div>
    <div class="metricgrid" id="mgrid"></div>
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn primary" id="saveLog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Save entry</button>
      <span class="hint">Saving updates the trend charts, funnel and goal bars instantly.</span>
    </div>
  </div>`;
  const mg=p.querySelector("#mgrid");
  metrics.forEach(m=>{
    const d=el("div","minput");
    d.innerHTML=`<label title="${esc(m.hint)}">${m.label}</label><input type="number" min="0" step="${m.k==='revenue'?'100':'1'}" data-mk="${m.k}" value="${existing[m.k]!=null?existing[m.k]:""}" placeholder="0">`;
    mg.appendChild(d);
  });
  if(readOnly){ p.querySelector("#saveLog").disabled=true; p.querySelectorAll("input").forEach(i=>i.disabled=true); }
  p.querySelector("#saveLog").onclick=()=>{
    const date=p.querySelector("#logDate").value||today;
    const entry={date};
    p.querySelectorAll("[data-mk]").forEach(i=>{ const val=i.value.trim(); if(val!=="") entry[i.dataset.mk]=num(val); });
    c.logs=(c.logs||[]).filter(l=>l.date!==date);
    c.logs.push(entry);
    scheduleSave(); toast("KPIs logged for "+date); render();
  };
  v.appendChild(p);

  // history
  const h=el("div","panel");h.style.marginTop="18px";
  const logs=(c.logs||[]).slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,30);
  let rows="";
  if(logs.length){
    rows=`<div class="tablewrap"><table class="log"><thead><tr><th>Date</th>${metrics.map(m=>`<th>${m.label.replace(/ \(₹\)/,"")}</th>`).join("")}</tr></thead><tbody>`;
    logs.forEach(l=>{ rows+=`<tr><td>${l.date}</td>${metrics.map(m=>`<td>${l[m.k]!=null?(m.k==='revenue'?"₹"+fmt(l[m.k]):fmt(l[m.k])):'<span class="muted">·</span>'}</td>`).join("")}</tr>`; });
    rows+="</tbody></table></div>";
  }else rows=`<div class="emptymini">No entries yet — log today's numbers above to start the history.</div>`;
  h.innerHTML=`<div class="ph"><h3>Entry history</h3><div class="line"></div><span class="count muted">last ${logs.length}</span></div><div class="pb" style="padding-top:4px">${rows}</div>`;
  v.appendChild(h);
}

function renderTrends(v,c){
  const isAppt=c.type==="appt";
  const metrics=isAppt?APPT_METRICS:BRAND_METRICS;
  const grid=el("div","cardgrid");
  metrics.forEach(m=>{
    const vals=last7(c,m.k);
    const total=vals.reduce((a,b)=>a+b,0);
    const prev=(function(){const arr=[];const map={};(c.logs||[]).forEach(l=>{map[l.date]=(map[l.date]||0)+num(l[m.k]);});for(let i=13;i>=7;i--){const d=new Date();d.setDate(d.getDate()-i);arr.push(map[d.toISOString().slice(0,10)]||0);}return arr.reduce((a,b)=>a+b,0);})();
    const delta = prev>0? Math.round((total-prev)/prev*100) : (total>0?100:0);
    const dcls=delta>0?"up":delta<0?"down":"flat";
    const p=el("div","panel trendcard");p.style.padding="16px 18px";
    p.innerHTML=`<div class="th"><div><div class="tk">${m.label}</div><div class="tv">${m.k==="revenue"?"₹"+fmt(total):fmt(total)}</div></div><div class="delta ${dcls}">${delta>0?"+":""}${delta}%</div></div>
      ${spark(vals,240,50,m.k==="revenue"||m.k==="closed"?"var(--good)":isAppt?"var(--appt)":"var(--brandline)")}
      <div class="hint" style="margin-top:8px">7-day total · vs prior 7 days</div>`;
    grid.appendChild(p);
  });
  v.appendChild(grid);
}

function renderTasks(v,c){
  const p=el("div","panel");
  p.innerHTML=`<div class="ph"><h3>Task board</h3><div class="line"></div><span class="count muted">${(c.tasks||[]).filter(t=>!t.done).length} open</span></div><div class="pb"></div>`;
  const pb=p.querySelector(".pb");
  const list=el("div","tasklist");
  const tasks=(c.tasks||[]).slice().sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    return (a.due||"9999")<(b.due||"9999")?-1:1;
  });
  if(!tasks.length) list.appendChild(el("div","emptymini","No tasks yet. Add the first daily action below."));
  tasks.forEach(t=>list.appendChild(buildTaskRow(c,t)));
  pb.appendChild(list);
  if(!readOnly){
    const add=el("div","addtask");
    add.innerHTML=`<input id="ttitle" placeholder="Add a task — e.g. 'Send 30 outreach DMs'">
      <select id="tpri"><option value="med">Medium</option><option value="high">High</option><option value="low">Low</option></select>
      <input type="date" id="tdue" style="width:auto" value="${todayStr()}">
      <button class="btn primary" id="taddbtn">Add</button>`;
    add.querySelector("#taddbtn").onclick=()=>{
      const ti=add.querySelector("#ttitle"); if(!ti.value.trim())return;
      c.tasks=c.tasks||[]; c.tasks.push({id:uid(),title:ti.value.trim(),done:false,pri:add.querySelector("#tpri").value,due:add.querySelector("#tdue").value});
      scheduleSave(); render();
    };
    add.querySelector("#ttitle").addEventListener("keydown",e=>{if(e.key==="Enter")add.querySelector("#taddbtn").click();});
    pb.appendChild(add);
  }
  v.appendChild(p);
}
function buildTaskRow(c,t){
  const over=t.due&&t.due<todayStr()&&!t.done, tod=t.due===todayStr()&&!t.done;
  const r=el("div","taskrow"+(t.done?" done":""));
  r.innerHTML=`<div class="check${t.done?" on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div class="tt">${esc(t.title)}</div>
    <div class="tmeta">
      ${t.pri?`<span class="pri ${t.pri}">${t.pri}</span>`:""}
      ${t.due?`<span class="duetag ${over?"over":tod?"today":""}">${over?"overdue":t.due===todayStr()?"today":t.due}</span>`:""}
      ${readOnly?"":`<button class="iconbtn" style="width:26px;height:26px;border:0" data-del title="Delete"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`}
    </div>`;
  if(!readOnly){
    r.querySelector(".check").onclick=()=>{t.done=!t.done;scheduleSave();render();};
    r.querySelector("[data-del]").onclick=()=>{c.tasks=c.tasks.filter(x=>x.id!==t.id);scheduleSave();render();};
  }
  return r;
}

function renderPipeline(v,c){
  const head=el("div","panel");
  const total=sumMetric(c,"outreach",30)||1;
  const stages=[
    ["Outreach sent","outreach","var(--appt)"],
    ["Conversations","convos","var(--appt)"],
    ["Positive replies","positive","#f6a93b"],
    ["Calls booked","booked","var(--brand)"],
    ["Calls showed","showed","var(--brand)"],
    ["Qualified","qualified","#2bb39f"],
    ["Closed / won","closed","var(--good)"]
  ];
  const maxV=Math.max(...stages.map(s=>sumMetric(c,s[1],30)),1);
  let fh="";
  stages.forEach(s=>{
    const val=sumMetric(c,s[1],30);
    const w=Math.max(6,Math.round(val/maxV*100));
    fh+=`<div class="fstage"><div class="flab">${s[0]}</div><div class="fbar" style="width:${w}%;background:${s[2]}">${fmt(val)}</div><div class="fpct">${pct(val,total)}%</div></div>`;
  });
  head.innerHTML=`<div class="ph"><h3>Outbound funnel · 30 days</h3><div class="line"></div></div><div class="pb"><div class="funnel">${fh}</div></div>`;
  v.appendChild(head);

  // conversion tiles
  const b7=sumMetric(c,"booked",30),sh=sumMetric(c,"showed",30),q=sumMetric(c,"qualified",30),cl=sumMetric(c,"closed",30),cv=sumMetric(c,"convos",30);
  const tiles=[["Book rate",pct(b7,cv)+"%","conversations → booked"],["Show rate",pct(sh,b7)+"%","booked → showed"],["Qualify rate",pct(q,sh)+"%","showed → qualified"],["Close rate",pct(cl,q)+"%","qualified → won"]];
  const row=el("div","tilerow");row.style.marginTop="18px";
  tiles.forEach(t=>{const d=el("div","tile");d.innerHTML=`<div class="k">${t[0]}</div><div class="v">${t[1]}</div><div class="meta">${t[2]}</div>`;row.appendChild(d);});
  v.appendChild(row);
}

    <div class="tile"><div class="k">Revenue</div><div class="v">₹${fmt(sumMetric(c,"revenue",30))}</div><div class="meta">attributed</div></div>
  </div></div>`;
  v.appendChild(cp);
}

/* ---------- TODAY ---------- */
function renderToday(v){
  setHead("Today", new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"}));
  const open=allOpenTasks();
  const overdue=open.filter(x=>x.t.due&&x.t.due<todayStr());
  const today=open.filter(x=>x.t.due===todayStr());
  const upcoming=open.filter(x=>x.t.due&&x.t.due>todayStr());
  const noDate=open.filter(x=>!x.t.due);

  const row=el("div","tilerow");
  [["Due today",today.length,"var(--brand)"],["Overdue",overdue.length,overdue.length?"var(--crit)":"var(--muted)"],["Upcoming",upcoming.length,"var(--appt)"],["Clients tracked",state.clients.length,"var(--brandline)"]].forEach(t=>{
    const d=el("div","tile");d.innerHTML=`<div class="rail-accent" style="background:${t[2]}"></div><div class="k">${t[0]}</div><div class="v">${t[1]}</div>`;row.appendChild(d);
  });
  v.appendChild(row);

  function section(title,items,cls){
    if(!items.length)return;
    const h=el("div","sectionhead");h.innerHTML=`<h2>${title}</h2><span class="count">${items.length}</span><div class="line"></div>`;v.appendChild(h);
    const p=el("div","panel");const pb=el("div","pb");p.appendChild(pb);const list=el("div","tasklist");
    items.forEach(({c,t})=>{
      const r=buildTaskRow(c,t);
      const meta=r.querySelector(".tt");
      meta.innerHTML=`${esc(t.title)} <span class="muted" style="font-weight:500">· ${esc(c.name)}</span>`;
      list.appendChild(r);
    });
    pb.appendChild(list);v.appendChild(p);
  }
  if(!open.length){
    const e=el("div","empty");e.innerHTML=`<div class="ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg></div><h3>Inbox zero</h3><p>No open tasks across any client. Add tasks from a client's Task board to see them here.</p>`;
    v.appendChild(e);return;
  }
  section("Overdue",overdue);
  section("Due today",today);
  section("No due date",noDate);
  section("Upcoming",upcoming);
}

      </div>
      <div class="editrow">
        <div class="field" id="tierField"><label>Offer tier</label><select id="ctier">${OFFER_TIERS.map(o=>`<option>${o}</option>`).join("")}</select></div>
        <div class="field"><label>Status</label><select id="cstatus">${STATUSES.map(s=>`<option ${s==="Onboarding"?"selected":""}>${s}</option>`).join("")}</select></div>
      </div>
    </div>
    <div class="mf"><button class="btn ghost" id="cancel">Cancel</button><button class="btn primary" id="create">Create dashboard</button></div>`);
  const tp=$("#typepick");
  tp.querySelectorAll(".typeopt").forEach(o=>o.onclick=()=>{tp.querySelectorAll(".typeopt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");addType=o.dataset.type;$("#tierField").style.display=addType==="brand"?"":"none";});
  $("#cancel").onclick=closeModal;
  $("#cname").addEventListener("keydown",e=>{if(e.key==="Enter")$("#create").click();});
  $("#create").onclick=()=>{
    const name=$("#cname").value.trim(); if(!name){$("#cname").focus();return;}
    const c={id:uid(),type:addType,name,owner:$("#cowner").value,niche:$("#cniche").value.trim(),
      offerTier:addType==="brand"?$("#ctier").value:"",status:$("#cstatus").value,
      platforms:[],goals:{},delivery:{},logs:[],tasks:[],created:todayStr()};
    state.clients.push(c); scheduleSave(); closeModal();
    ui.view="client";ui.clientId=c.id;ui.tab="overview";render();
    toast("Client dashboard created");
  };
}

function openEditModal(c){
  openModal(`
    <div class="mh"><div style="flex:1"><h2>Edit ${esc(c.name)}</h2><p>Update positioning, goals and status.</p></div></div>
    <div class="mb">
      <div class="editrow">
        <div class="field"><label>Client name</label><input id="e_name" value="${esc(c.name)}"></div>
        <div class="field"><label>Owner</label><select id="e_owner">${OWNERS.map(o=>`<option ${o===c.owner?"selected":""}>${o}</option>`).join("")}</select></div>
      </div>
      <div class="editrow">
        <div class="field"><label>Status</label><select id="e_status">${STATUSES.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select></div>
        ${c.type==="brand"?`<div class="field"><label>Offer tier</label><select id="e_tier">${OFFER_TIERS.map(o=>`<option ${o===c.offerTier?"selected":""}>${o}</option>`).join("")}</select></div>`:`<div class="field"><label>Primary channel</label><select id="e_tier">${AS_CHANNELS.map(o=>`<option ${o===c.offerTier?"selected":""}>${o}</option>`).join("")}</select></div>`}
      </div>
      <div class="field"><label>Niche / ICP</label><input id="e_niche" value="${esc(c.niche||"")}"></div>
      <div class="field"><label>${c.type==="appt"?"Target ICP & offer":"Monetization model"}</label><input id="e_offer" value="${esc(c.offer||"")}"></div>
      <div class="field"><label>Platforms / channels</label><div class="tagline" id="e_plat">${PLATFORMS.map(p=>`<span class="pill" data-p="${p}" style="cursor:pointer;${(c.platforms||[]).includes(p)?'background:var(--brand-soft);color:var(--brand-ink)':''}">${p}</span>`).join("")}</div></div>
      <div class="editrow">
        <div class="field"><label>What's working</label><textarea id="e_working">${esc(c.working||"")}</textarea></div>
        <div class="field"><label>What's not working</label><textarea id="e_notw">${esc(c.notWorking||"")}</textarea></div>
      </div>
      <div class="field"><label>Tone / voice reference</label><input id="e_tone" value="${esc(c.tone||"")}"></div>
      <div class="grid3">
        ${goalInputs(c)}
      </div>
      <div class="field" style="margin-top:14px"><label>KPIs set / agreement notes</label><textarea id="e_gnotes">${esc((c.goals||{}).notes||"")}</textarea></div>
      <div class="field"><label>General notes</label><textarea id="e_notes">${esc(c.notes||"")}</textarea></div>
    </div>
    <div class="mf"><button class="btn ghost" id="cancel">Cancel</button><button class="btn primary" id="save">Save changes</button></div>`);
  const plat=new Set(c.platforms||[]);
  $("#e_plat").querySelectorAll("[data-p]").forEach(sp=>sp.onclick=()=>{
    const p=sp.dataset.p; if(plat.has(p)){plat.delete(p);sp.style.background="";sp.style.color="";}else{plat.add(p);sp.style.background="var(--brand-soft)";sp.style.color="var(--brand-ink)";}
  });
  $("#cancel").onclick=closeModal;
  $("#save").onclick=()=>{
    c.name=$("#e_name").value.trim()||c.name; c.owner=$("#e_owner").value; c.status=$("#e_status").value;
    c.offerTier=$("#e_tier").value; c.niche=$("#e_niche").value.trim(); c.offer=$("#e_offer").value.trim();
    c.working=$("#e_working").value.trim(); c.notWorking=$("#e_notw").value.trim(); c.tone=$("#e_tone").value.trim();
    c.notes=$("#e_notes").value.trim(); c.platforms=[...plat];
    c.goals=c.goals||{}; document.querySelectorAll("[data-goal]").forEach(i=>{c.goals[i.dataset.goal]=num(i.value);});
    c.goals.notes=$("#e_gnotes").value.trim();
    scheduleSave(); closeModal(); render(); toast("Client updated");
  };
}
function goalInputs(c){
  const g=c.goals||{};
  const set = c.type==="appt"
    ? [["Daily outreach","outreachGoal"],["Weekly calls booked","bookedGoal"],["Monthly closes","closedGoal"]]
    : [["Weekly posts","postedGoal"],["Weekly calls booked","bookedGoal"],["Monthly revenue ₹","revenueGoal"]];
  return set.map(([lab,k])=>`<div class="field"><label>${lab}</label><input type="number" min="0" data-goal="${k}" value="${g[k]!=null?g[k]:""}" placeholder="0"></div>`).join("");
}

function confirmDelete(c){
  openModal(`<div class="mh"><div style="flex:1"><h2>Delete ${esc(c.name)}?</h2><p>This removes the client and all their KPI history and tasks. This can't be undone.</p></div></div>
    <div class="mf"><button class="btn ghost" id="cancel">Keep client</button><button class="btn primary" id="del" style="background:var(--crit);border-color:var(--crit);color:#fff">Delete permanently</button></div>`);
  $("#cancel").onclick=closeModal;
  $("#del").onclick=()=>{state.clients=state.clients.filter(x=>x.id!==c.id);scheduleSave();closeModal();ui.view="home";render();toast("Client deleted");};
}

/* ---------- SAMPLES ---------- */

  const mk=(days,fn)=>{const l=[];for(let i=0;i<days;i++){const d=new Date();d.setDate(d.getDate()-i);l.push(Object.assign({date:d.toISOString().slice(0,10)},fn(i)));}return l;};
  const s1={id:uid(),type:"appt",name:"Aarav Mehta — Business Coach",owner:"Setter",niche:"Business coaches, Indore",offer:"₹40k group program",status:"Active",offerTier:"WhatsApp",platforms:["WhatsApp","Instagram"],
    working:"Voice notes outperforming text 3x on first touch.",notWorking:"Email open rates low — WhatsApp is the channel.",tone:"Hinglish, peer-to-peer",
    goals:{outreachGoal:40,bookedGoal:8,closedGoal:4,notes:"Book 8 strategy calls/week, 40 touches/day across WhatsApp + IG."},delivery:{},
    logs:mk(21,i=>({outreach:35+Math.round(Math.random()*20),dials:8+Math.round(Math.random()*6),convos:6+Math.round(Math.random()*5),positive:2+Math.round(Math.random()*3),booked:i%3?1:2,showed:i%4?1:0,qualified:i%5?0:1,closed:i%9?0:1,followups:10+Math.round(Math.random()*8)})),
    tasks:[{id:uid(),title:"Send 40 WhatsApp voice notes",done:false,pri:"high",due:todayStr()},{id:uid(),title:"Follow up Day-5 cold leads",done:false,pri:"med",due:todayStr()},{id:uid(),title:"Confirm tomorrow's 3 booked calls",done:true,pri:"med",due:todayStr()}],created:todayStr()};
  const s2={id:uid(),type:"brand",name:"Sana Kapoor — Mindset Coach",owner:"Creative VA",niche:"Mindset & confidence coaching",offer:"High-ticket 1:1 + cohort",status:"Active",offerTier:"Magnet",platforms:["Instagram","YouTube","Email"],
    working:"Pain-driven reels beating curiosity hooks. 'Free audit' CTA driving DMs.",notWorking:"Reels dropping after 20s — testing shorter format.",tone:"Warm, direct, story-led",
    goals:{postedGoal:6,bookedGoal:5,revenueGoal:200000,notes:"6 posts/week, 5 calls booked/week, ₹2L/month attributed."},delivery:{audit:true,content:true,revisions:true,loom:true,checkin:todayStr()},
    logs:mk(21,i=>({produced:1+Math.round(Math.random()*2),posted:i%2?1:0,impressions:9000+Math.round(Math.random()*8000),visits:600+Math.round(Math.random()*500),saves:120+Math.round(Math.random()*100),dms:15+Math.round(Math.random()*25),clicks:40+Math.round(Math.random()*70),booked:i%4?1:2,revenue:i%6?0:15000})),
    tasks:[{id:uid(),title:"Script 3 identity-shift reels",done:false,pri:"high",due:todayStr()},{id:uid(),title:"Send weekly metrics snapshot",done:false,pri:"med",due:todayStr()},{id:uid(),title:"Collect testimonial from last close",done:false,pri:"low",due:""}],created:todayStr()};
  state.clients.push(s1,s2); scheduleSave(); render(); toast("Sample clients loaded — edit or delete freely");
}

document.querySelectorAll(".navitem[data-nav]").forEach(b=>{
  b.onclick=()=>{
    const n=b.dataset.nav; closeRail();
    if(n==="appt"||n==="brand"){ui.view="clients";ui.filter=n;}
    else if(n==="clients"){ui.view="clients";ui.filter="all";}
    else if(n==="home"){ui.view="home";ui.filter="all";}
    else{ui.view=n;ui.filter="all";}
    render();
  };
});
$("#addBtn").onclick=openAddModal;
$("#themeToggle").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next); localStorage.setItem("kaj_theme",next);
};
function openRail(){$("#rail").classList.add("open");$("#scrim").classList.add("on");}
function closeRail(){$("#rail").classList.remove("open");$("#scrim").classList.remove("on");}
$("#menuBtn").onclick=openRail; $("#scrim").onclick=closeRail;

let toastTimer;
function toast(msg){const t=$("#toast");t.innerHTML=`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>${esc(msg)}`;t.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),2400);}

boot();
})();
</script>
